<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry | Lotte India</title><meta name="description" content="Send a general enquiry to Lotte India."><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body class="inner-page"><nav id="navbar"><div class="nav-container"><a class="nav-logo" href="index.html"><img src="https://www.lotteindia.com/images/logo.png" alt="Lotte India"></a><div class="nav-menu"><a class="nav-link" href="about-us.html">About Us</a><a class="nav-link" href="choco-pie.html">Our Brands</a><a class="nav-link" href="faq.html">FAQ</a><a class="nav-link" href="contact-us.html">Contact Us</a></div><button class="nav-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button></div></nav>
<header class="page-banner" style="height:300px"><img class="page-banner-img" src="https://www.lotteindia.com/images/lotte-building.jpg" alt="Contact Lotte India"><div class="page-banner-overlay"></div><div class="container page-banner-content"><h1>Send an <span>Enquiry</span></h1></div></header>
<main class="form-section"><div class="form-container"><h2 class="form-title">How can we <span>help?</span></h2><p class="form-desc">Fields marked with * are required. This demonstration form validates input locally.</p>
<form data-validate>
<div class="form-row"><div class="form-group"><label for="name">Name <span class="required">*</span></label><input class="form-control" id="name" name="name" required placeholder="Your name"></div><div class="form-group"><label for="email">Email <span class="required">*</span></label><input class="form-control" id="email" name="email" type="email" required placeholder="name@example.com"></div></div>
<div class="form-row"><div class="form-group"><label for="phone">Phone</label><input class="form-control" id="phone" name="phone" type="tel" placeholder="+91"></div><div class="form-group"><label for="topic">Enquiry type <span class="required">*</span></label><select class="form-control" id="topic" name="topic" required><option value="">Select a topic</option><option>General information</option><option>Distribution</option><option>Careers</option><option>Corporate</option></select></div></div>
<div class="form-group"><label for="message">Message <span class="required">*</span></label><textarea class="form-control" id="message" name="message" required placeholder="Tell us how we can help"></textarea></div><button class="btn btn-primary form-submit" type="submit">Submit Enquiry <i class="fas fa-paper-plane"></i></button>
</form><div class="success-msg" role="status">Thank you. Your enquiry has been validated successfully.</div></div></main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><p>© 2026 Lotte India Corporation Private Limited</p></div></div></footer><script src="js/main.js" defer></script></body></html>
